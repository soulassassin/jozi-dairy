<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" className="w-full h-full">
  <!-- Johannesburg Skyline Silhouette in Cyan Tint -->
  <g fill="#00a8e8" opacity="0.45">
    <!-- Hillbrow / Sentech Tower -->
    <rect x="178" y="20" width="4" height="110" rx="2" />
    <circle cx="180" cy="80" r="14" />
    <rect x="174" y="65" width="12" height="6" rx="2" fill="#00b4d8" />
    <rect x="176" y="96" width="8" height="34" rx="2" />
    <!-- City High-Rises -->
    <rect x="70" y="110" width="35" height="120" rx="2" />
    <rect x="110" y="90" width="28" height="140" rx="2" />
    <polygon points="124,65 110,90 138,90" />
    <rect x="142" y="115" width="26" height="115" rx="2" />
    <rect x="195" y="105" width="42" height="125" rx="2" />
    <rect x="242" y="120" width="30" height="110" rx="2" />
    <rect x="278" y="85" width="36" height="145" rx="2" />
    <polygon points="296,60 278,85 314,85" />
    <rect x="320" y="110" width="45" height="120" rx="2" />
    <rect x="370" y="125" width="50" height="105" rx="2" />
  </g>

  <!-- Red Dynamic Brush Banner with Splatter Angle (-13deg tilt) -->
  <g transform="rotate(-13, 240, 240)">
    <!-- Backing glow -->
    <path d="M 60 170 C 80 150, 160 130, 420 120 C 440 120, 470 145, 450 175 C 440 190, 460 230, 435 255 C 410 280, 425 310, 390 315 C 340 320, 280 345, 180 340 C 130 338, 70 320, 50 280 C 35 250, 40 200, 60 170 Z" fill="#00a8e8" opacity="0.3" filter="blur(6px)" />
    
    <!-- Primary Red Brush Badge -->
    <path d="M 70 160 C 100 142, 200 128, 410 118 C 435 118, 455 135, 442 165 C 430 190, 450 220, 430 248 C 410 275, 420 295, 385 305 C 330 318, 250 332, 170 330 C 120 328, 65 310, 52 275 C 42 245, 48 190, 70 160 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

    <!-- Splatter droplets -->
    <circle cx="430" cy="110" r="5" fill="#ef4444" />
    <circle cx="448" cy="122" r="3" fill="#ef4444" />
    <circle cx="465" cy="160" r="6" fill="#ef4444" />
    <circle cx="452" cy="270" r="8" fill="#ef4444" />
    <circle cx="60" cy="145" r="7" fill="#ef4444" />
    <circle cx="42" cy="180" r="5" fill="#ef4444" />
    <circle cx="75" cy="325" r="8" fill="#ef4444" />

    <!-- JOZI Typography -->
    <text x="245" y="215" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="4">JOZI</text>
    
    <!-- DAIRY Typography -->
    <text x="245" y="295" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="5">DAIRY</text>
  </g>
</svg>
